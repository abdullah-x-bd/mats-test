name: Scan repeated agent constraints

on:
  push:
    branches: [main]
    paths:
      - "scripts/scan_repeated_constraints.py"
      - ".github/workflows/scan-repeated-constraints.yml"
  workflow_dispatch:

permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check requests
      - name: Scan
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/scan_repeated_constraints.py
      - name: Commit derived metadata
        run: |
          git config user.name "mats-test-bot"
          git config user.email "actions@users.noreply.github.com"
          git add results/repeated_constraint_candidates.json results/repeated_constraint_candidates.md
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "Add repeated-constraint candidate scan"; git push; fi
