name: Audit public chat evidence

on:
  push:
    branches: [main]
    paths:
      - "scripts/audit_public_chat.py"
      - ".github/workflows/audit-public-chat.yml"
  workflow_dispatch:

permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check requests
      - name: Extract public chat evidence
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/audit_public_chat.py
      - name: Commit evidence
        run: |
          git config user.name "mats-test-bot"
          git config user.email "actions@users.noreply.github.com"
          git add results/public_chat_event_audit.json
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "Add public chat evidence audit"; git push; fi
