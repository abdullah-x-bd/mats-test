name: Analyze AI Village memories

on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/analyze-ai-village.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Run gated AI Village analysis
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/analyze_ai_village.py

      - name: Commit derived diagnostics
        run: |
          git config user.name "mats-test-bot"
          git config user.email "actions@users.noreply.github.com"
          git add results/diagnostics.json results/report.md
          if git diff --cached --quiet; then
            echo "No diagnostic changes to commit."
          else
            git commit -m "Add AI Village derived diagnostics"
            git push
          fi
